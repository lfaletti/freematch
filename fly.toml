[app]
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
NODE_ENV = "production"

[build]
dockerfile = "backend/Dockerfile"

[processes]
app = "npm start --prefix backend"

[checks]
"http" = {
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"
  type = "http"
}

[[services]]
internal_port = 3000
processes = ["app"]
protocol = "tcp"
script_checks = []

  [services.concurrency]
  hard_limit = 25
  soft_limit = 20
  type = "connections"

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

[[statics]]
guest_path = "/app/dist"
url_prefix = "/static"
