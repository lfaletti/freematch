version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: freematch-db
    environment:
      POSTGRES_USER: freematch
      POSTGRES_PASSWORD: freematch123
      POSTGRES_DB: freematch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freematch -d freematch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freematch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freematch-backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://freematch:freematch123@postgres:5432/freematch_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_ENDPOINT: http://localhost:4566
      S3_BUCKET: freematch-dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
