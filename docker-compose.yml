version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: freematch-db
    environment:
      POSTGRES_USER: freematch
      POSTGRES_PASSWORD: freematch123
      POSTGRES_DB: freematch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freematch -d freematch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freematch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: freematch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and make it publicly readable so the
  # browser can load uploaded photos directly by URL.
  minio-init:
    image: minio/mc:latest
    container_name: freematch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/freematch-dev &&
      mc anonymous set download local/freematch-dev
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freematch-backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://freematch:freematch123@postgres:5432/freematch_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      # Endpoint the backend uses to talk to MinIO (container network)
      AWS_S3_ENDPOINT: http://minio:9000
      # Endpoint baked into returned photo URLs so the browser can reach them
      # (use 127.0.0.1, not localhost — Windows resolves localhost to IPv6 ::1).
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: freematch-dev
      # Geoapify key comes from repo-root .env (gitignored) so the secret
      # isn't committed. Fails loudly if missing.
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:?}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped
    # Reflect real serving state in `docker ps` (a crashed boot used to show "Up"
    # despite nothing listening). Uses node since the image has no curl/wget.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
