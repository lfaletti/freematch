[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[[services]]
name = "backend"
startCommand = "npm start --prefix backend"

[[services]]
name = "postgres"
image = "postgres:15-alpine"

[[services]]
name = "redis"
image = "redis:7-alpine"

[deploy]
startCommand = "npm start"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 5
